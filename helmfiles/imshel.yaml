apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-imsdeployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.labels.app }}
    spec:
      containers:
      - name: ims
        image: {{ .Values.image.registary }}:{{ .Values.image.tag }}
        env:
          name: {{ .Values.env.name }}
          value: {{ .Values.env.link | quote }}
        ports:
        - containerPort: {{ .Values.service.port }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webservice
spec:
  selector:
    app: {{ .Values.labels.app }}
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}


